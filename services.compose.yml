# Included by docker-compose.yml, which supplies private/.env for ${...} values.
x-common: &common
  image: shoebox:latest
  env_file: private/.env
  volumes:
    - ${PHOTO_ROOT:?set PHOTO_ROOT in private/.env}:/photos:ro
    - shoebox-data:/data
    - ${BACKUP_ROOT:?set BACKUP_ROOT in private/.env}:/backup
    - ./private:/config:ro
    # Extra collections (separate sets of photos), slots 2-5: set COLLECTION_<n>_NAME, _PHOTOS and
    # _BACKUP in private/.env. An unset slot mounts an empty placeholder that the app ignores.
    - ${COLLECTION_2_PHOTOS:-./config/unused}:/collections/2/photos:ro
    - ${COLLECTION_2_BACKUP:-./config/unused}:/collections/2/backup
    - ${COLLECTION_3_PHOTOS:-./config/unused}:/collections/3/photos:ro
    - ${COLLECTION_3_BACKUP:-./config/unused}:/collections/3/backup
    - ${COLLECTION_4_PHOTOS:-./config/unused}:/collections/4/photos:ro
    - ${COLLECTION_4_BACKUP:-./config/unused}:/collections/4/backup
    - ${COLLECTION_5_PHOTOS:-./config/unused}:/collections/5/photos:ro
    - ${COLLECTION_5_BACKUP:-./config/unused}:/collections/5/backup
  restart: unless-stopped

services:
  app:
    <<: *common
    build: .
    command: ["python", "-m", "shoebox.cli", "serve"]
    ports:
      # Only this Mac by default. SHOEBOX_BIND=0.0.0.0 in private/.env opens it to the home
      # network (the app reads the same setting and then accepts .local names and private IPs).
      - "${SHOEBOX_BIND:-127.0.0.1}:8000:8000"

  # The phone and iPad app: the same API on its own port, with its own touch UI. Add
  # http://<this Mac>.local:8001 to the Home Screen (SHOEBOX_BIND opens it to the network too).
  touch:
    <<: *common
    command: ["python", "-m", "shoebox.cli", "serve", "--port", "8001"]
    environment:
      SHOEBOX_FRONTEND: /app/frontend/dist-touch
    ports:
      - "${SHOEBOX_BIND:-127.0.0.1}:8001:8001"
    depends_on:
      - app

  worker:
    <<: *common
    command: ["python", "-m", "shoebox.cli", "worker"]
    depends_on:
      - app

volumes:
  # Live layer. Survives `docker compose down`; wiped by `down -v` and by
  # Docker Desktop "Clean / Purge data". The backup folder is the permanent copy.
  shoebox-data:
