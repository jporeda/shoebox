# Used only for `alembic revision --autogenerate` during development.
# The app runs migrations programmatically (shoebox.db.migrate).
[alembic]
script_location = %(here)s/backend/shoebox/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
